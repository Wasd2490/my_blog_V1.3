<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>characteristic · 博客</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#ff6b9d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="博客"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<script src="https://fastly.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{--bg:#fdf7f9;--ink:#000;--ink-soft:#0a0a0a;--pink:#ff6b9d;--pink-deep:#e14b7e;--pink-soft:#ffd6e3;--line:#f0d9e2;--card:#fff;--blue:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(253,247,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#c4b5fd);color:#fff;display:grid;place-items:center;font-family:'Ma Shan Zheng';font-weight:700}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{text-decoration:none;color:var(--ink-soft);font-size:14px}
.nav-links a.active,.nav-links a:hover{color:var(--ink)}
.page{max-width:1100px;margin:80px auto 60px;padding:0 32px}
h1{font-size:26px;margin-bottom:8px;font-weight:600}
.sub{color:var(--ink-soft);font-size:14px;margin-bottom:24px}
.sub a{color:var(--blue);text-decoration:none}
.loading{text-align:center;padding:60px;color:var(--ink-soft)}
.repo{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden}
.repo-head{padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;cursor:pointer}
.repo-head:hover{background:#f6f8fa}
.repo-head h2{font-size:19px;color:var(--blue);font-weight:600}
.repo-head h2 .owner{color:var(--ink-soft);font-weight:400}
.repo-head .meta{font-size:13px;color:var(--ink-soft);margin-top:6px}
.repo-actions{display:flex;gap:8px;align-items:center}
.btn{padding:5px 14px;border:1px solid var(--line);border-radius:6px;background:#f6f8fa;font-size:13px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.repo-body{display:none;border-top:1px solid var(--line)}
.repo.open .repo-body{display:grid;grid-template-columns:220px 1fr 200px}
.filetree{border-right:1px solid var(--line);padding:16px;font-size:13px;overflow:auto;max-height:600px}
.filetree .dir{color:var(--ink);font-weight:500;padding:4px 0;cursor:pointer}
.filetree .dir::before{content:'📁 '}
.filetree .file{padding:3px 0 3px 16px;color:var(--ink-soft);cursor:pointer}
.filetree .file:hover{color:var(--blue)}
.filetree .file.active{color:var(--blue);font-weight:500}
.filetree .file::before{content:'📄 '}
.readme{padding:20px;min-width:0;border-right:1px solid var(--line);max-height:600px;overflow:auto}
.readme h1{font-size:20px;margin:12px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.readme h2{font-size:17px;margin:16px 0 6px}
.readme h3{font-size:14px;margin:12px 0 4px}
.readme p{margin:6px 0;font-size:14px}
.readme ul,.readme ol{margin:6px 0;padding-left:22px}
.readme code{background:rgba(27,31,36,.05);padding:2px 6px;border-radius:4px;font-size:13px}
.readme pre{background:#1e1e2e;color:#e6edf3;padding:14px;border-radius:8px;overflow-x:auto;margin:12px 0;font-size:13px;line-height:1.5}
.readme pre code{background:transparent;padding:0}
.readme a{color:var(--blue)}
.readme blockquote{border-left:4px solid var(--line);padding:4px 12px;color:var(--ink-soft);margin:10px 0}
.filepath{font-size:12px;color:var(--ink-soft);padding:8px 16px;border-bottom:1px solid var(--line);background:#f6f8fa}
.side{padding:20px;font-size:13px}
.side .sec{margin-bottom:16px}
.side .sec h4{font-size:13px;color:var(--ink);margin-bottom:8px;font-weight:600}
.side .lang{display:flex;align-items:center;gap:6px;margin:4px 0}
.dot{width:10px;height:10px;border-radius:50%}
.timeline{padding:16px 24px;border-top:1px solid var(--line)}
.timeline h4{font-size:13px;margin-bottom:10px}
.ev{position:relative;padding-left:20px;padding-bottom:12px;border-left:2px solid var(--line);font-size:13px}
.ev:last-child{padding-bottom:0}
.ev::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.ev .date{color:var(--ink-soft);font-size:11px}
.lang-color{JavaScript:#f1e05a;Python:#3572A5;Java:#b07219;C++:#f34b7d;C:#555555;Vue:#41b883;TypeScript:#3178c6}
footer{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
footer .hand{font-family:'Ma Shan Zheng';font-size:18px;color:var(--ink)}
@media(max-width:768px){.repo-body{grid-template-columns:1fr}.readme{border-right:none;border-bottom:1px solid var(--line)}.nav{padding:12px 18px}.nav-links{gap:12px;font-size:12px}}
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="index.html">characteristic · 博客</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="blog.html">博客</a>
    <a href="projects.html" class="active">项目</a>
    <a href="personal.html">记录</a>
    <a href="space.html">空间</a>
  </div>
</nav>

<div class="page">
  <div id="listView">
    <h1>项目</h1>
    <div class="sub">从 GitHub <a href="https://github.com/Wasd2490" target="_blank">@Wasd2490</a> 同步 · 点击仓库进入详情</div>
    <div id="repoList"><div class="loading">正在从 GitHub 拉取仓库…</div></div>
  </div>
  <div id="detailView" style="display:none">
    <a href="projects.html" style="color:var(--blue);text-decoration:none;font-size:14px">← 返回项目列表</a>
    <div id="repoDetail"></div>
  </div>
</div>

<footer>
  <div class="hand">characteristic · 博客</div>
  <div style="margin-top:8px">仅供学习·著作权归@谁暖了冬季所有</div>
</footer>

<script>
const GH_USER='Wasd2490';
const LANG_COLOR={JavaScript:'#f1e05a',Python:'#3572A5',Java:'#b07219',C:'#555555','C++':'#f34b7d',Vue:'#41b883',TypeScript:'#3178c6',Shell:'#89e051',Makefile:'#427819'};

async function fetchJSON(url){
  const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

async function loadReadme(owner,repo){
  try{
    const d=await fetchJSON(`/api/github-proxy?url=https://api.github.com/repos/${owner}/${repo}/readme`);
    const text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
    return marked.parse(text);
  }catch(e){return '<p style="color:#656d76">暂无 README</p>';}
}

async function loadCommits(owner,repo){
  try{
    const cs=await fetchJSON(`/api/github-proxy?url=https://api.github.com/repos/${owner}/${repo}/commits?per_page=5`);
    return cs.map(c=>({date:c.commit.author.date.slice(0,10),msg:c.commit.message.split('\n')[0]})).slice(0,5);
  }catch(e){return [];}
}

async function loadPath(owner,repo,path=''){
  try{
    const d=await fetchJSON(`/api/github-proxy?url=https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
    return Array.isArray(d)?d:[d];
  }catch(e){return [];}
}
async function loadFile(owner,repo,path){
  try{
    const d=await fetchJSON(`/api/github-proxy?url=https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
    if(d.type==='file'&&d.content){
      return decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
    }
  }catch(e){}
  return '';
}

async function main(){
  // hash 路由
  const m=location.hash.match(/^#repo\/(.+)$/);
  if(m){
    document.getElementById('listView').style.display='none';
    document.getElementById('detailView').style.display='block';
    await renderDetail(decodeURIComponent(m[1]));
    return;
  }
  // 列表
  const list=document.getElementById('repoList');
  try{
    const repos=await fetchJSON(`/api/github-proxy?url=https://api.github.com/users/${GH_USER}/repos?sort=updated&per_page=20`);
    if(!repos.length){list.innerHTML='<div class="loading">GitHub 上还没有公开仓库</div>';return;}
    list.innerHTML='';
    for(const r of repos){
      const card=document.createElement('div');
      card.className='repo';
      card.style.cursor='pointer';
      card.innerHTML=`
        <div class="repo-head" style="cursor:pointer">
          <div>
            <h2><span class="owner">${r.owner.login} /</span> ${r.name}</h2>
            <div class="meta">${r.description||'暂无描述'}</div>
          </div>
          <div class="repo-actions">
            <span class="btn">☆ ${r.stargazers_count}</span>
            <span class="btn">⑂ ${r.forks_count}</span>
            <a class="btn" href="${r.html_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ GitHub</a>
          </div>
        </div>
      `;
      card.addEventListener('click',()=>{location.hash=`#repo/${encodeURIComponent(r.name)}`;});
      list.appendChild(card);
    }
  }catch(e){
    list.innerHTML=`<div class="loading">GitHub 拉取失败（${e.message}）</div>`;
  }
}

async function renderDetail(repoName){
  const box=document.getElementById('repoDetail');
  box.innerHTML='<div class="loading">加载仓库…</div>';
  try{
    const r=await fetchJSON(`/api/github-proxy?url=https://api.github.com/repos/${GH_USER}/${repoName}`);
    box.innerHTML=`
      <div class="repo" style="margin-top:16px">
        <div class="repo-head" style="cursor:default">
          <div>
            <h2><span class="owner">${r.owner.login} /</span> ${r.name}</h2>
            <div class="meta">${r.description||'暂无描述'}</div>
          </div>
          <div class="repo-actions">
            <span class="btn">☆ ${r.stargazers_count}</span>
            <span class="btn">⑂ ${r.forks_count}</span>
            <a class="btn" href="${r.html_url}" target="_blank" rel="noopener">↗ GitHub</a>
          </div>
        </div>
        <div class="repo-body" style="display:grid;grid-template-columns:220px 1fr 200px">
          <div class="filetree"><div class="loading" style="padding:10px;font-size:12px">加载目录…</div></div>
          <div>
            <div class="filepath">README.md</div>
            <div class="readme" id="fr"><div class="loading">加载 README…</div></div>
          </div>
          <div class="side">
            <div class="sec"><h4>语言</h4><div class="lang"><span class="dot" style="background:${LANG_COLOR[r.language]||'#999'}"></span>${r.language||'未知'}</div></div>
            <div class="sec"><h4>更新</h4><div style="color:#656d76">${new Date(r.updated_at).toLocaleDateString()}</div></div>
          </div>
        </div>
      </div>
      <div style="margin-top:24px">
        <h4 style="font-family:'Ma Shan Zheng';color:var(--ink);margin-bottom:12px">评论</h4>
        <div id="repoCommentList"></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <input id="repoCommentText" placeholder="聊聊这个项目…" style="flex:1;padding:8px 14px;border:1px solid var(--line);border-radius:999px">
          <button onclick="postRepoComment('${repoName}')" style="padding:8px 18px;border:none;background:var(--pink);color:#fff;border-radius:999px;cursor:pointer">发送</button>
        </div>
      </div>
    `;
    await loadTree(box,GH_USER,repoName);
    loadRepoComments(repoName);
  }catch(e){
    box.innerHTML=`<div class="loading">加载失败：${e.message}</div><div style="text-align:center;margin-top:20px"><a href="projects.html" style="padding:10px 24px;background:var(--pink);color:#fff;border-radius:999px;text-decoration:none">← 返回项目列表</a></div>`;
  }
}
async function loadRepoComments(tid){
  try{
    const r=await fetch(`/api/comments/repo/${encodeURIComponent(tid)}`);
    const list=await r.json();
    document.getElementById('repoCommentList').innerHTML=list.map(c=>`
      <div style="padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px">
        <b style="color:var(--ink)">${c.nick}</b> <span style="font-size:12px;color:var(--ink-soft)">${c.date}</span>
        <div style="margin-top:4px">${c.content}</div>
      </div>`).join('')||'<div style="font-size:13px;color:var(--ink-soft);padding:8px 0">还没有评论</div>';
  }catch(e){document.getElementById('repoCommentList').innerHTML='';}
}
async function postRepoComment(tid){
  const v=document.getElementById('repoCommentText').value.trim();
  if(!v)return;
  const r=await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ttype:'repo',tid,content:v})});
  const d=await r.json();
  if(d.ok){document.getElementById('repoCommentText').value='';loadRepoComments(tid);}
  else alert(d.msg||'请先登录');
}
window.addEventListener('hashchange',()=>location.reload());
main();

async function loadTree(repoDiv,owner,repo,path=''){
  const ft=repoDiv.querySelector('.filetree');
  const items=await loadPath(owner,repo,path);
  if(!items.length){ft.innerHTML='<div style="color:#333;padding:10px">空目录</div>';return;}
  let html='';
  if(path)html+=`<div class="dir" data-path="${path.split('/').slice(0,-1).join('/')}">.. 返回上级</div>`;
  items.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='dir'?-1:1);
  for(const it of items){
    if(it.type==='dir'){
      html+=`<div class="dir" data-path="${it.path}">${it.name}</div>`;
    }else{
      html+=`<div class="file" data-path="${it.path}" data-name="${it.name}">${it.name}</div>`;
    }
  }
  ft.innerHTML=html;
  // 绑定目录点击
  ft.querySelectorAll('.dir').forEach(d=>d.addEventListener('click',async()=>{
    await loadTree(repoDiv,owner,repo,d.dataset.path);
  }));
  // 绑定文件点击
  ft.querySelectorAll('.file').forEach(f=>f.addEventListener('click',async()=>{
    ft.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    const content=await loadFile(owner,repo,f.dataset.path);
    repoDiv.querySelector('.filepath').textContent=f.dataset.path;
    const fr=repoDiv.querySelector('.readme');
    if(/\.md$/i.test(f.dataset.name)){
      fr.innerHTML=marked.parse(content);
    }else{
      fr.innerHTML=`<pre><code>${content.replace(/</g,'&lt;')}</code></pre>`;
    }
  }));
  // 默认打开 README
  const readmeFile=ft.querySelector('.file[data-name="README.md"]');
  if(readmeFile)readmeFile.click();
}
main();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script></body>
</html>
