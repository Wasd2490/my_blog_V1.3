<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>characteristic · 博客</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#ff6b9d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="博客"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#fdf7f9;--ink:#e14b7e;--ink-soft:#0a0a0a;--pink:#ff6b9d;--pink-deep:#e14b7e;--pink-soft:#ffd6e3;--line:#f0d9e2;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(253,247,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#c4b5fd);color:#fff;display:grid;place-items:center;font-family:'Ma Shan Zheng';font-weight:700}
.nav-links{display:flex;gap:22px;align-items:center}
.nav-links a{text-decoration:none;color:var(--ink-soft);font-size:14px}
.nav-links a.active,.nav-links a:hover{color:var(--ink)}
.page{max-width:680px;margin:90px auto 60px;padding:0 20px}
h1{font-family:'Ma Shan Zheng';font-size:28px;margin-bottom:18px}
.publisher{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
.publisher textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;outline:none}
.publisher textarea:focus{border-color:var(--pink)}
.media-row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.media-row input[type=file]{display:none}
.media-row label{padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.media-row label:hover{background:var(--pink-soft);color:var(--ink)}
.pub-btn{padding:9px 22px;border:none;border-radius:999px;background:var(--pink);color:#fff;font-size:14px;cursor:pointer;margin-left:auto}
.pub-btn:hover{background:var(--pink-deep)}
.moment{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.moment-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.moment-head img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--pink)}
.moment-head .name{font-weight:600;font-size:14px}
.moment-head .time{font-size:12px;color:var(--ink-soft)}
.moment-text{font-size:14px;white-space:pre-wrap;margin-bottom:12px}
.moment-media{margin-bottom:12px}
.moment-media img{max-width:100%;border-radius:12px;display:block;margin-bottom:8px}
.moment-media video{max-width:100%;border-radius:12px;display:block}
.moment-foot{display:flex;gap:16px;font-size:13px;color:var(--ink-soft)}
.moment-foot span{cursor:pointer}
.moment-foot span:hover{color:var(--ink)}
.comments{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.comment{font-size:13px;margin-bottom:8px}
.comment b{color:var(--ink)}
.comment-input{display:flex;gap:8px;margin-top:10px}
.comment-input input{flex:1;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;outline:none}
.comment-input button{padding:7px 16px;border:none;border-radius:999px;background:var(--pink);color:#fff;font-size:13px;cursor:pointer}
.empty{text-align:center;padding:50px;color:var(--ink-soft)}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:12px;border:none;background:transparent;font-size:15px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--pink);font-weight:600}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.album .photo{aspect-ratio:1;overflow:hidden;border-radius:12px;cursor:pointer;position:relative}
.album .photo img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.album .photo:hover img{transform:scale(1.05)}
.album .photo .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;padding:16px 8px 6px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;place-items:center;cursor:zoom-out}
.lightbox img{max-width:90%;max-height:90%}
footer{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
footer .hand{font-family:'Ma Shan Zheng';font-size:18px;color:var(--ink)}
@media(max-width:768px){.nav{padding:12px 18px}.nav-links{gap:12px;font-size:12px}}
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="index.html">characteristic · 博客</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="blog.html">博客</a>
    <a href="projects.html">项目</a>
    <a href="personal.html">记录</a>
    <a href="space.html" class="active">空间</a>

  </div>
</nav>

<div class="page">
  <h1>空间 · 日常分享</h1>
  <div class="tabs">
    <button class="active" onclick="switchTab('mom')">动态</button>
    <button onclick="switchTab('album')">相册</button>
  </div>
  <div id="momTab">
  <div class="publisher">
    <textarea id="momText" placeholder="今天有什么新鲜事…"></textarea>
    <div class="media-row">
      <label for="momImg">🖼 传照片</label>
      <input type="file" id="momImg" accept="image/*">
      <label for="momVideo">🎬 传视频</label>
      <input type="file" id="momVideo" accept="video/*">
      <span id="mediaPreview" style="font-size:12px;color:var(--ink-soft)"></span>
      <button class="pub-btn" onclick="publishMom()">发布</button>
    </div>
  </div>
  <div id="momList"></div>
  </div>
  <div id="albumTab" style="display:none">
    <div class="album" id="albumGrid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg"></div>

<footer>
  <div class="hand">characteristic · 博客</div>
  <div style="margin-top:8px">仅供学习·著作权归@谁暖了冬季所有</div>
</footer>

<script>
let MOMS=[];
let pendingMedia=null;
let pendingType=null;

async function loadMom(){
  try{
    const r=await fetch('/api/moments');
    MOMS=await r.json();
    render();
  }catch(e){document.getElementById('momList').innerHTML='<div class="empty">后端未启动</div>';}
}

document.getElementById('momImg').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{pendingMedia=r.result;pendingType='img';document.getElementById('mediaPreview').textContent='已选图片：'+f.name;};
  r.readAsDataURL(f);
});
document.getElementById('momVideo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{pendingMedia=r.result;pendingType='video';document.getElementById('mediaPreview').textContent='已选视频：'+f.name;};
  r.readAsDataURL(f);
});

async function publishMom(){
  const text=document.getElementById('momText').value.trim();
  if(!text&&!pendingMedia){alert('写点内容或选个媒体');return;}
  try{
    const r=await fetch('/api/moments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,media:pendingMedia||'',type:pendingType||'text'})});
    if(!r.ok){alert('发布失败：'+r.status);return;}
    document.getElementById('momText').value='';
    pendingMedia=null;pendingType=null;
    document.getElementById('mediaPreview').textContent='';
    loadMom();
  }catch(e){alert('网络错误：'+e.message);}
}

function addComment(idx){
  const inp=document.getElementById('c'+idx);
  const v=inp.value.trim();if(!v)return;
  alert('评论功能待后端完善');
}

async function delMom(idx){
  if(confirm('删除这条动态？')){
    await fetch('/api/moments/'+MOMS[idx].id,{method:'DELETE'});
    loadMom();
  }
}

let MOMS_PAGE=1;const MOMS_SIZE=4;
function render(){
  const el=document.getElementById('momList');
  if(!MOMS.length){el.innerHTML='<div class="empty">还没有动态，发第一条日常吧～</div>';return;}
  const totalPages=Math.ceil(MOMS.length/MOMS_SIZE);
  if(MOMS_PAGE<1)MOMS_PAGE=1;
  if(MOMS_PAGE>totalPages)MOMS_PAGE=totalPages;
  const start=(MOMS_PAGE-1)*MOMS_SIZE;
  const slice=MOMS.slice(start,start+MOMS_SIZE);
  el.innerHTML=slice.map((m,idx)=>{
    const i=start+idx;
    let mediaHtml='';
    if(m.media){
      if(m.media.startsWith('data:image')) mediaHtml='<div class="moment-media"><img src="'+m.media+'"></div>';
      else mediaHtml='<div class="moment-media"><video src="'+m.media+'" controls></video></div>';
    }
    return '<div class="moment">'+
      '<div class="moment-head"><img src="assets/avatar.png"><div><div class="name">谁暖了冬季</div><div class="time">'+m.date+'</div></div>'+
      '<span style="margin-left:auto;cursor:pointer;color:var(--ink-soft);font-size:18px" onclick="delMom('+i+')" title="删除">×</span></div>'+
      '<div class="moment-text">'+(m.text||'')+'</div>'+mediaHtml+
      '<div class="moment-foot"><span>❤️ 评论</span></div>'+
      '<div class="comments"><div class="comment-input"><input type="text" id="c'+i+'" placeholder="说点什么…"><button onclick="addComment('+i+')">评论</button></div></div>'+
    '</div>';
  }).join('');
  if(totalPages>1){
    el.innerHTML+=`<div style="display:flex;justify-content:center;gap:10px;margin-top:16px">
      <button onclick="MOMS_PAGE--;render()" style="padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer">← 上一页</button>
      <span style="padding:8px 0;color:var(--ink-soft)">${MOMS_PAGE} / ${totalPages}</span>
      <button onclick="MOMS_PAGE++;render()" style="padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer">下一页 →</button>
    </div>`;
  }
}
loadMom();

function switchTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('momTab').style.display=t==='mom'?'block':'none';
  document.getElementById('albumTab').style.display=t==='album'?'block':'none';
  if(t==='album')renderAlbum();
}

function renderAlbum(){
  const photos=MOMS.filter(m=>m.type==='img'&&m.media);
  const el=document.getElementById('albumGrid');
  if(!photos.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">相册还没有照片，发动态时传照片就会自动收集到这里</div>';return;}
  el.innerHTML=photos.map(m=>`
    <div class="photo" onclick="openLightbox('${m.media}')">
      <img src="${m.media}">
      <div class="cap">${m.date}</div>
    </div>
  `).join('');
}

function openLightbox(src){
  document.getElementById('lightboxImg').src=src;
  document.getElementById('lightbox').style.display='grid';
}

function delMom(i){
  if(confirm('删除这条动态？')){
    MOMS.splice(i,1);
    localStorage.setItem('glowden_moms',JSON.stringify(MOMS));
    render();
  }
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
<!-- 🎵 音乐播放器 -->
<div id="music-player" style="position:fixed;bottom:24px;right:24px;z-index:9999;font-family:'Noto Sans SC',sans-serif;">
  <!-- 播放列表弹窗 -->
  <div id="playlist-popup" style="display:none;position:absolute;bottom:72px;right:0;width:260px;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 8px 32px rgba(255,107,157,0.25);padding:14px;margin-bottom:8px;">
    <div style="font-size:14px;font-weight:600;margin-bottom:10px;color:#e14b7e;">🎵 我的歌单</div>
    <div id="playlist-items"></div>
  </div>

  <!-- 进度条 -->
  <div style="position:absolute;bottom:66px;right:4px;width:52px;height:4px;background:rgba(0,0,0,0.1);border-radius:2px;overflow:hidden;">
    <div id="progress-fill" style="width:0%;height:100%;background:linear-gradient(90deg,#ff6b9d,#e14b7e);transition:width 0.3s;"></div>
  </div>

  <!-- 主按钮组 -->
  <div style="display:flex;align-items:center;gap:8px;">
    <!-- 上一首 -->
    <button onclick="playPrev()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.95);border:none;color:#e14b7e;font-size:15px;cursor:pointer;box-shadow:0 2px 10px rgba(255,107,157,0.2);display:flex;align-items:center;justify-content:center;">⏮</button>
    
    <!-- 播放/暂停 -->
    <button onclick="togglePlay()" style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#e14b7e);border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,157,0.4);display:flex;align-items:center;justify-content:center;transition:transform 0.2s;">▶</button>
    
    <!-- 下一首 -->
    <button onclick="playNext()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.95);border:none;color:#e14b7e;font-size:15px;cursor:pointer;box-shadow:0 2px 10px rgba(255,107,157,0.2);display:flex;align-items:center;justify-content:center;">⏭</button>
    
    <!-- 播放列表按钮 -->
    <button onclick="togglePlaylist()" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.95);border:none;color:#e14b7e;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(255,107,157,0.2);margin-left:4px;">☰</button>
  </div>

  <audio id="audio-player"></audio>
</div>

<script>
// 歌单 - 替换成你自己的音乐链接
var playlist = [
  { title: '无间渡', url: '/assets/music/1.mp3' },
  { title: '你要的全拿走', url: '/assets/music/2.mp3' },
  { title: '忘不掉的你', url: '/assets/music/3.mp3' },
  { title: '把回忆拼好给你', url: '/assets/music/4.mp3' }
];
var currentIndex = 0;
var isPlaying = false;
var audio = document.getElementById('audio-player');
var playBtn = document.querySelector('#music-player button[onclick="togglePlay()"]');

// 渲染播放列表
function renderPlaylist() {
  var html = '';
  for (var i = 0; i < playlist.length; i++) {
    html += '<div onclick="selectTrack(' + i + ')" style="padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:' + (i === currentIndex ? '#e14b7e' : '#666') + ';background:' + (i === currentIndex ? 'rgba(255,107,157,0.1)' : 'transparent') + ';margin-bottom:2px;">' + playlist[i].title + '</div>';
  }
  document.getElementById('playlist-items').innerHTML = html;
}

function loadTrack(index) {
  currentIndex = index;
  audio.src = playlist[currentIndex].url;
  renderPlaylist();
  if (isPlaying) {
    audio.play();
  }
}

function togglePlay() {
  if (isPlaying) {
    audio.pause();
    playBtn.innerHTML = '▶';
  } else {
    audio.play();
    playBtn.innerHTML = '⏸';
  }
  isPlaying = !isPlaying;
}

function playNext() {
  loadTrack((currentIndex + 1) % playlist.length);
  if (!isPlaying) togglePlay();
}

function playPrev() {
  loadTrack((currentIndex - 1 + playlist.length) % playlist.length);
  if (!isPlaying) togglePlay();
}

function selectTrack(index) {
  loadTrack(index);
  if (!isPlaying) togglePlay();
  document.getElementById('playlist-popup').style.display = 'none';
}

function togglePlaylist() {
  var popup = document.getElementById('playlist-popup');
  popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
}

// 进度条更新
audio.addEventListener('timeupdate', function() {
  if (audio.duration) {
    var percent = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progress-fill').style.width = percent + '%';
  }
});

// 自动下一首
audio.addEventListener('ended', function() {
  playNext();
});

// 初始化
loadTrack(0);
renderPlaylist();
</script>

</body>
</html>
